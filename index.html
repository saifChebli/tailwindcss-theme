<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">

        /* 1) DESIGN TOKENS : update these to re-theme everything */

        @theme {
            --color-brand-50 : #eef2ff;
            --color-brand-100 : #e0e7ff ;
            --color-brand-500 : #6366f1 ;
            --color-brand-600 : #4f46e5 ;
            --color-brand-700 : #4338ca ;

            --font-sans : "Inter", sans-serif;
            --radius-field : 0.75rem;
            --shadow-card: 0 10px 40px -10px rgb(0 ,0 ,0, 0.25);
        }

        /* 2) SEMANTIC TOKENS (light by default) */

        :root {
            --surface : #ffffff;
            --page : #f1f5f9;
            --ink : #0f172A;
            --muted : #64748b;
            --line : #cbd5e1;
        }


        /* 3) Expose the variables as utilities */
         
        @theme inline {
            --color-surface : var(--surface);
            --color-page : var(--page);
            --color-ink : var(--ink);
            --color-muted: var(--muted);
            --color-line : var(--line);
        }


    </style>
</head>

<body class="min-h-screen bg-page text-ink font-sans flex items-center justify-center p-4">
    <form action="" class="space-y-4 w-full shadow-card bg-surface rounded-2xl p-6 sm:p-8 max-w-lg">
        <header>
            <h1 class="text-2xl font-bold tracking-tight">Create your account</h1>
            <p class="text-sm text-muted mt-1">Fill in the details to get started </p>
        </header>
        <!-- Name + Email -->
        <div class="grid sm:grid-cols-2 gap-4">
            <div>
                <label for="name" class="text-sm font-medium mb-1.5">Full name</label>
                <input type="text" id="name" required placeholder="Enter your name here" class="w-full rounded-field border border-line
                    bg-transparent px-3.5 py-2.5 focus:outline-none
                    focus:border-brand-500 focus:ring-1 focus:ring-brand-500/20
                    transition placeholder:text-muted/60
                    ">
            </div>
            <div>
                <label for="">Email</label>
                <input type="email" required placeholder="example@example.com" class="w-full rounded-field border border-line
                    bg-transparent px-3.5 py-2.5 focus:outline-none
                    focus:border-brand-500 focus:ring-1 focus:ring-brand-500/20
                    transition placeholder:text-muted/60
                    ">
            </div>
        </div>

        <!-- Password -->
        <div>
            <label for="password" class="text-sm font-medium mb-1.5 block">Password</label>
            <input type="password" id="password" required minlength="8" placeholder="********" class="w-full rounded-field border border-line
                    bg-transparent px-3.5 py-2.5 focus:outline-none
                    focus:border-brand-500 focus:ring-1 focus:ring-brand-500/20
                    transition placeholder:text-muted/60
                    ">
        </div>
        <!-- Select -->

        <div>
            <label for="country" class="text-sm font-medium mb-1.5 block">Country</label>
            <select name="" id=""
                class="w-full rounded-field border border-line bg-surface px-3.5 py-2.5 focus:outline-none transition focus:border-brand-500 focus:ring-1 focus:ring-brand-500/20">
                <option value="">Germany</option>
                <option value="">France</option>
                <option value="">United States</option>
            </select>
        </div>

        <!-- Buttons -->

        <div class="flex flex-col gap-3 sm:flex-row">
            <button type="reset" class="flex-1 rounded-field border border-line px-4 py-2.5 font-medium
            hover:bg-line/30 transition cursor-pointer
            
            ">Reset</button>
            <button type="submit" class="flex-1 rounded-field bg-brand-600 px-4 py-2.5 font-semibold text-white
            hover:bg-brand-700 active:scale-[0.98] transition focus:outline-none
            focus:border-brand-500 focus:ring-1 focus:ring-brand-500/20
            transition placeholder:text-muted/60 cursor-pointer
            ">Create account</button>
        </div>
    </form>
</body>

</html>
